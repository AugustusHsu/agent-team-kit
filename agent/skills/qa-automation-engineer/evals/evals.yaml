# qa-automation-engineer Skill 驗證用 Test Cases
# 用途：驗證 Skill 是否能正確讀取 Test Plan 並產出符合專案規範的自動化測試程式碼
# 格式：每組 Eval 定義一個使用者情境 + 預期輸出 + 驗證斷言

skill_name: qa-automation-engineer

evals:
  # ─────────────────────────────────────────────
  # Eval 1: 從 Test Plan 產出 Pytest 測試腳本
  # 驗證情境：使用者指定 Test Plan 中的特定 Test IDs，要求轉化為可執行的 Pytest 程式碼
  # ─────────────────────────────────────────────
  - id: 1
    name: "test-plan-to-pytest"
    prompt: >
      docs/features/user_management_system/test_plan.md 裡面 Auth 相關的 Test Cases
      (T-AUTH-001 ~ T-AUTH-005) 幫我寫成 Pytest 測試腳本，放到 backend/tests/ 裡面
    input_files:
      - docs/features/user_management_system/test_plan.md
      - backend/tests/conftest.py
      - backend/tests/test_auth.py
    expected_output: >
      產出一份 Pytest 測試檔案，包含 5 個測試函式，每個函式嚴格遵循 AAA 結構，
      使用既有的 conftest.py fixtures，並附有繁體中文 docstring。
    assertions:
      - text: "輸出為合法的 Python 檔案，可被 pytest 識別並執行"
        type: executable
        priority: critical
      - text: "每個測試函式包含清晰的 Arrange / Act / Assert 三段式結構，以註解分隔"
        type: structural
        priority: critical
      - text: "使用 client: AsyncClient fixture 作為 API 互動入口，不自行建立新的 HTTP Client"
        type: integration
        priority: high
      - text: "每個測試函式有繁體中文 docstring，內含對應的 Test ID"
        type: documentation
        priority: high
      - text: "不與既有 test_auth.py 中的測試重複"
        type: deduplication
        priority: high
      - text: "測試檔案放在 backend/tests/ 目錄下"
        type: file_output
        priority: medium

  # ─────────────────────────────────────────────
  # Eval 2: 測試重構 — 分析 + 重寫舊測試
  # 驗證情境：使用者指定一份「雜亂」的測試檔案，要求分析問題並重構
  # ─────────────────────────────────────────────
  - id: 2
    name: "test-refactoring"
    prompt: >
      backend/tests/test_users.py 這檔案的測試看起來很冗長，有些測試在驗證好幾件事。
      幫我分析一下它的問題，然後重構成更乾淨的寫法
    input_files:
      - backend/tests/test_users.py
      - backend/tests/conftest.py
    expected_output: >
      先產出一份分析報告（Markdown 表格），列出每個測試函式的問題，
      然後提出重構方案。經使用者確認後執行重構，確保 make test 通過。
    assertions:
      - text: "先輸出分析報告，包含原始函式名、實際測試意圖、問題、重構建議四欄"
        type: analysis
        priority: critical
      - text: "重構後每個測試函式只驗證一件事（Single Assertion Principle）"
        type: structural
        priority: high
      - text: "重構後使用 class 分組相關測試"
        type: organization
        priority: medium
      - text: "重構前後覆蓋率不降低"
        type: coverage
        priority: critical
      - text: "執行 make test 確認所有測試通過"
        type: verification
        priority: critical

  # ─────────────────────────────────────────────
  # Eval 3: 複雜業務規則的整合測試
  # 驗證情境：使用者指定特定的業務規則 (BR-*)，要求撰寫涵蓋 Edge Cases 的整合測試
  # ─────────────────────────────────────────────
  - id: 3
    name: "complex-integration-test"
    prompt: >
      我需要測試 Workspace 成員管理的 API（新增成員、移除成員、搜尋可新增使用者），
      幫我寫整合測試。要特別注意 BR-PERM-11 的聯動刪除邏輯和 BR-PERM-10 的 Manager 自動同步
    input_files:
      - docs/features/user_management_system/prd.md
      - docs/features/user_management_system/api_spec.md
      - backend/tests/conftest.py
    expected_output: >
      產出一份 Integration 測試檔案，放在 backend/tests/integration/ 目錄下，
      涵蓋成員管理的 Happy Path、權限檢查和業務規則的 Edge Cases。
    assertions:
      - text: "檔案放在 backend/tests/integration/ 目錄下"
        type: file_output
        priority: high
      - text: "包含 BR-PERM-10 的測試：成員成為 Project Manager 後 WS 角色自動升級為 manager"
        type: coverage
        priority: critical
      - text: "包含 BR-PERM-11 的測試：移除 WS 成員時聯動刪除所有 Project 成員資格"
        type: coverage
        priority: critical
      - text: "包含 BR-PERM-11 的防呆測試：嘗試移除擔任 manager 角色的成員被拒（HTTP 400）"
        type: edge_case
        priority: critical
      - text: "每個測試函式使用 AAA 結構並附有繁體中文 docstring"
        type: structural
        priority: high
      - text: "不自行建立新的 DB connection 或 Redis client，使用 conftest 提供的 fixtures"
        type: integration
        priority: high
