# 這份 pyproject 只服務「測試這個套件本身」，不會被安裝進你的專案。
# kit/ 底下沒有任何 Python 套件，安裝出去的三支腳本只用標準函式庫。
[project]
name = "agent-team-kit"
version = "0.1.0"
description = "AI 虛擬團隊工單驅動開發流程套件"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
