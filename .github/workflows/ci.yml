name: CI

# 開發全程在整合分支上、不開 PR（git_workflow.md §8.3（b））。
# 只監聽 main 的話，commit 要等到合併進主線才第一次被檢查——太晚了。
#
# 本 repo 的第 1 層流程檢查不寫在這裡：它由 kit 出貨、再裝回本 repo 的
# .github/workflows/kit-precheck.yml 負責——dogfooding 就該讓安裝實例真的跑。
on:
  push:
    branches: [main, 'feature/**', 'PEV-*']
  pull_request:

# 同一分支連續推送時，取消還沒跑完的舊 run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: 安裝 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 執行測試
        run: uv run --python ${{ matrix.python-version }} pytest

  # 腳本只依賴標準函式庫，這裡確認「什麼都沒裝」的環境也跑得動
  stdlib-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝到暫存專案並執行腳本
        run: |
          mkdir -p /tmp/demo
          ./install.sh /tmp/demo
          cd /tmp/demo
          # 照 install.sh 指示的第 2 步，從骨架複製出第一個功能模組
          cp -r docs/features/_TEMPLATE docs/features/my_module
          python .agent/scripts/scan_backlog.py --format summary
          python .agent/scripts/scan_backlog.py --format backlog --output docs/development/BACKLOG.md
          python .agent/scripts/migrate_dates.py
          # 乾淨安裝的專案也要跑得動 precheck（出貨腳本不能只在本 repo 能跑）
          python .agent/scripts/precheck.py
